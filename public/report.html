<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GBP Business Report</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1b1b1a;--mut:#6b6b66;--bd:#e2e2dd;--ac:#0f6e56;--hi:#b3261e;--md:#b26a00;--lo:#5a5a55;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--tx:#ecebe6;--mut:#a3a29b;--bd:#3a3a37;--ac:#4cc3a0;--hi:#ff8a80;--md:#ffb74d;--lo:#a3a29b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:960px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}
.s{color:var(--mut);margin:0 0 14px}a{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:10px 18px;border-radius:8px;border:0;background:var(--ac);color:var(--bg);font:inherit;font-weight:600;cursor:pointer;margin-right:8px}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.t{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mut);font-weight:600}
.r{border-left:4px solid var(--bd);padding:10px 12px;margin-bottom:10px;background:var(--bg);border-radius:0 8px 8px 0}
.r.High{border-color:var(--hi)}.r.Medium{border-color:var(--md)}.r.Low{border-color:var(--lo)}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--bd);margin-left:6px;color:var(--mut)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div b{display:block;font-size:20px}.kv div span{font-size:12px;color:var(--mut)}
ul{margin:6px 0 0 18px;padding:0}
summary{cursor:pointer}summary.why{font-size:18px;font-weight:700;color:var(--ac)}
details.cmp{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--bg)}
details.cmp>summary{font-weight:600}.chips{font-weight:400;color:var(--mut);font-size:13px}
.v-ahead{color:var(--hi);font-weight:700}.v-behind{color:var(--ac);font-weight:700}.v-even,.v-na{color:var(--mut)}
.fix{margin:2px 0 8px 0;font-size:13px;color:var(--mut)}
@media print{.noprint{display:none}body{background:#fff;color:#000}.card{break-inside:avoid}}
</style></head><body><div class="w">
<h1>Business report</h1>
<p class="s noprint">Enter a business and city. The tool finds it, finds the real competitors, compares categories, reviews and photos, and builds a plan. <a href="/">Back to the diagnosis tool</a></p>

<div class="card noprint"><div class="g">
<div><label>Access code</label><input id="code" type="password" autocomplete="off"></div>
<div><label>Business name (as on Google Maps)</label><input id="bn"></div>
<div><label>City</label><input id="city" placeholder="Maple Ridge"></div>
<div><label>Or coordinates lat,lng,zoom (optional)</label><input id="coord" placeholder="49.1044,-122.6608,14z"></div>
<div><label>Country (2-letter code)</label><input id="cc" maxlength="2" placeholder="CA" style="text-transform:uppercase"></div>
<div><label>Main keyword (optional)</label><input id="kw" placeholder="defaults to the business category"></div>
</div>
<div style="margin-top:10px"><button onclick="build()">Build report</button></div>
<div id="msg" class="note"></div><div id="pick"></div></div>

<div id="rep"></div>
</div>
<script>
const $=i=>document.getElementById(i);
const esc=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nz=s=>String(s||'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim().replace(/(^|\s)(\p{L})\s(?=\p{L}(\s|$))/gu,'$1$2');
function nmatch(a,b){a=nz(a);b=nz(b);if(!a||!b)return false;if(a.includes(b)||b.includes(a))return true;const A=a.split(' '),B=b.split(' '),sm=A.length<=B.length?A:B,bg=A.length<=B.length?B:A;return sm.length>=3&&sm.filter(w=>bg.includes(w)).length/sm.length>=0.75}
const cn=s=>String(s||'').toLowerCase().replace(/centre/g,'center').trim();
const med=a=>{a=a.filter(x=>x!=null&&!isNaN(x)).sort((x,y)=>x-y);if(!a.length)return 0;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const votes=i=>(i.rating&&i.rating.votes_count)||0,stars=i=>(i.rating&&i.rating.value)||0;
const cats=i=>[i.category,...(i.additional_categories||[])].filter(Boolean);
try{$('code').value=localStorage.getItem('gbp_code')||'';$('cc').value=localStorage.getItem('gbp_cc')||''}catch(e){}

async function call(body){const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json','x-access-code':$('code').value},body:JSON.stringify(body)});const tx=await r.text();let d;try{d=JSON.parse(tx)}catch(e){throw new Error('The server sent an unexpected reply (HTTP '+r.status+'). It may be down or restarting, or this page is not being served by your Railway app. Open /health on the same address to check.')}if(!r.ok)throw new Error(d.error||'Search failed.');return d}

function simList(items,name){const seen=new Set(),tf={};items.forEach(i=>new Set(nz(i.title).split(' ')).forEach(w=>tf[w]=(tf[w]||0)+1));
const gen=new Set(Object.keys(tf).filter(w=>tf[w]>=items.length*0.4));
const q=new Set(nz(name).split(' ').filter(w=>w.length>2&&!gen.has(w)));
return items.filter(i=>!seen.has(i.place_id)&&seen.add(i.place_id)).map(i=>({i,s:nz(i.title).split(' ').filter(w=>q.has(w)).length})).filter(x=>x.s>=Math.max(1,Math.ceil(q.size*0.5))).sort((a,b)=>b.s-a.s).map(x=>x.i)}

async function build(){
const m=$('msg'),name=$('bn').value.trim(),loc={location:$('city').value.trim(),coordinate:$('coord').value.trim(),country:$('cc').value.trim()};
$('pick').textContent='';$('rep').textContent='';
if(!name||(!loc.location&&!loc.coordinate)){m.textContent='Enter the business name and the city (or coordinates).';return}
try{localStorage.setItem('gbp_code',$('code').value);localStorage.setItem('gbp_cc',$('cc').value)}catch(e){}
m.textContent='Finding the business...';
try{
const d=await call({keyword:name,...loc}),ms=d.items.filter(i=>nmatch(i.title,name));
if(ms.length===1){await analyse(ms[0],loc);return}
if(ms.length>1){m.textContent='Several businesses match. Choose yours:';showPick(ms.slice(0,5),loc);return}
const sh=nz(name).split(' ').slice(0,3).join(' ');let all=d.items;
if(sh&&sh!==nz(name)){m.textContent='Trying a shorter name...';const d2=await call({keyword:sh,...loc}),m2=d2.items.filter(i=>nmatch(i.title,sh));
if(m2.length){m.textContent='Found using a shorter name. Confirm it is your client:';showPick(m2.slice(0,5),loc);return}all=all.concat(d2.items)}
const sims=simList(all,name);
if(sims.length){m.textContent='No exact match. These have a similar name; choose yours if it is listed:';showPick(sims.slice(0,5),loc)}
else m.textContent='Could not find "'+name+'" in '+(loc.location||'that area')+'. The search returned other businesses, but none with a similar name. Check the name exactly as on Google Maps, try a nearby city, or enter the business coordinates.';
}catch(e){m.textContent=e.message||'Could not reach the server.'}}

function showPick(list,loc){const el=$('pick');el.textContent='';list.forEach(ci=>{const row=document.createElement('div');row.className='r Low';const d=document.createElement('div');d.textContent=ci.title+' \u00b7 '+(ci.category||'no category')+' \u00b7 '+votes(ci)+' reviews \u00b7 '+(ci.address||'');row.appendChild(d);const b=document.createElement('button');b.className='sec';b.style.marginTop='6px';b.textContent='This is my client';b.onclick=()=>{el.textContent='';analyse(ci,loc).catch(e=>{$('msg').textContent=e.message})};row.appendChild(b);el.appendChild(row)})}

async function analyse(client,loc){
const kw=$('kw').value.trim()||client.category;
if(!kw){$('msg').textContent='This business has no category, so enter a main keyword and try again.';return}
$('msg').textContent='Analysing competitors for "'+kw+'"...';
let d=await call({keyword:kw,...loc});
if(d.items.filter(i=>i.place_id!==client.place_id).length<3&&loc.coordinate){$('msg').textContent='Few results nearby, widening the search area...';const d2=await call({keyword:kw,...loc,coordinate:wider(loc.coordinate)});if(d2.items.length>d.items.length)d=d2}
$('msg').textContent='';render(client,d,kw,loc)}

const STOP=new Set(['near','best','the','and','for','top','in','me','my','of','a']);
const hav=(a,b,c,d)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),q=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(q))};
const num=(a,b,hi,lo)=>{const r=a/Math.max(b,1);return r>=hi?'ahead':r<=lo?'behind':'even'};
function gaps(client,c,x){
const F=[],p=(key,label,pat,w,them,you,verdict,st,why,fix)=>F.push({key,label,pat,w,them,you,verdict,st:Math.max(0,Math.min(1,st||0)),why,fix});
const cc=cn(c.category),kc=cn(client.category),cons=cn(x.top?x.top.n:'');
p('cat','Primary category','the main category most competitors use',5,c.category||'none',client.category||'none',cc===cons&&kc!==cons?'ahead':kc===cons&&cc!==cons?'behind':'even',1,
`Their primary category matches the market's most common one ("${x.top?x.top.n:''}"). Primary category is among the strongest relevance signals.`,`Switch to "${x.top?x.top.n:''}" only if it truly describes the business, and keep your current one as a secondary.`);
const th=new Set(cats(c).map(cn)),lack=(c.additional_categories||[]).filter(a=>!x.mine.has(cn(a))&&(x.fq[cn(a)]||{c:0}).c>=x.thr),rev=(client.additional_categories||[]).filter(a=>!th.has(cn(a))&&(x.fq[cn(a)]||{c:0}).c>=x.thr);
p('sec','Relevant secondary categories','relevant secondary categories you lack',3,(c.additional_categories||[]).length+' extra',(client.additional_categories||[]).length+' extra',lack.length>rev.length?'ahead':lack.length<rev.length?'behind':'even',lack.length/3,
lack.length?`They use categories the client lacks: ${lack.slice(0,5).join(', ')}.`:'',`Add the ones that genuinely apply: ${lack.slice(0,5).join(', ')}.`);
const rc=votes(c),rk=votes(client),rr=rc/Math.max(rk,1);
p('rev','Review count','more reviews',5,rc,rk,num(rc,rk,1.25,0.8),(rr-1)/2,`They have ${rc} reviews to your ${rk}. Review volume is a major prominence signal.`,`Close the gap of about ${Math.max(rc-rk,0)} reviews: ask every happy customer, and have the request mention the service and area.`);
const sd=stars(c)-stars(client);
p('rat','Rating','a higher rating',2,stars(c)||'-',stars(client)||'-',stars(c)&&stars(client)?(sd>=0.2?'ahead':sd<=-0.2?'behind':'even'):'na',sd/0.5,`Their rating is ${stars(c)} against your ${stars(client)}.`,'Reply to every review, fix recurring complaints, and ask satisfied customers to review.');
const pc=c.total_photos||0,pk=client.total_photos||0;
p('ph','Photos','more photos',1.5,pc,pk,num(pc,pk,1.3,0.77),(pc/Math.max(pk,1)-1)/2,`They have ${pc} photos to your ${pk}.`,`Add about ${Math.max(pc-pk,0)} real photos gradually (exterior, interior, team, the service in action).`);
p('web','Website','a website you lack',2,c.domain?'Yes':'No',client.domain?'Yes':'No',c.domain&&!client.domain?'ahead':!c.domain&&client.domain?'behind':'even',1,'They link a website and you do not.','Add a website with a page for your main service and area.');
const stem=w=>w.slice(0,5),cnt=title=>{const tt=nz(title).split(' ').map(stem);return x.kws.filter(k=>tt.includes(stem(k))).length};
const nc=cnt(c.title),nk=cnt(client.title);
p('name','Search words in the business name','search words in their business name',2,nc+' of '+x.kws.length,nk+' of '+x.kws.length,nc>nk?'ahead':nc<nk?'behind':'even',(nc-nk)/2,`Their name contains words from the search ("${x.kws.join(' ')}"). Google gives the name some weight.`,'Do not change your name to add keywords. Google can suspend profiles whose name differs from the real one. Use your description, services and website for those words instead.');
let dC=null,dK=null;if(x.cen&&c.latitude!=null&&client.latitude!=null){dC=hav(x.cen[0],x.cen[1],c.latitude,c.longitude);dK=hav(x.cen[0],x.cen[1],client.latitude,client.longitude)}
p('dist','Distance from the centre of the search area (estimated)','a location closer to the centre',3,dC==null?'-':dC.toFixed(1)+' km',dK==null?'-':dK.toFixed(1)+' km',dC==null?'na':dK-dC>=1?'ahead':dC-dK>=1?'behind':'even',dC==null?0:(dK-dC)/5,`They are about ${dC==null?'?':(dK-dC).toFixed(1)} km closer to the middle of the area. Distance is a major local ranking factor.`,'You cannot move the business. Offset it with reviews, strong categories, a website page for each area you serve, and reviews that mention the area.');
p('clm','Listing claimed','a verified listing (yours is not)',4,c.is_claimed===false?'No':'Yes',client.is_claimed===false?'No':'Yes',c.is_claimed!==false&&client.is_claimed===false?'ahead':'even',1,'Their listing is claimed and yours is not.','Claim and verify the profile first.');
const hc=c.hours_week,hk=client.hours_week;
p('hrs','Weekly opening hours listed','longer opening hours',1,hc==null?'-':hc+' h',hk==null?'none listed':hk+' h',hc==null?'na':hk==null||hc-hk>=10?'ahead':hk-hc>=10?'behind':'even',hk==null?1:(hc-hk)/30,`They list ${hc} hours a week and you list ${hk==null?'none':hk}.`,'Add accurate opening hours, including holidays.');
p('tel','Phone number','a phone number you lack',0.5,c.phone?'Yes':'No',client.phone?'Yes':'No',c.phone&&!client.phone?'ahead':'even',1,'They list a phone number and you do not.','Add your phone number.');
return F}

function whyCard(client,ahead,self,d,kw,loc,top,fq,thr,mine,comp){
const kws=nz(kw).split(' ').filter(w=>w.length>2&&!STOP.has(w)&&!nz(loc.location||'').split(' ').includes(w));
let cen=null;const m=(loc.coordinate||'').split(',').map(parseFloat);
if(m.length>=2&&!isNaN(m[0])&&!isNaN(m[1]))cen=[m[0],m[1]];else{const la=d.items.map(i=>i.latitude).filter(v=>v!=null),lo=d.items.map(i=>i.longitude).filter(v=>v!=null);if(la.length)cen=[med(la),med(lo)]}
const x={top,fq,thr,mine,kws,cen};
if(!ahead.length)return '<div class="card" id="why"><h2>Why are my competitors ahead of me?</h2><div>The client ranks #1 for this search, so no competitor is ahead. Use the plan below to defend the position.</div></div>';
const rows=ahead.map(c=>({c,F:gaps(client,c,x),ix:comp.indexOf(c)}));
rows.forEach(r=>{r.top=r.F.filter(f=>f.verdict==='ahead').map(f=>({f,s:f.w*f.st})).sort((a,b)=>b.s-a.s)});
const pat={};rows.forEach(r=>r.F.forEach(f=>{if(f.verdict==='ahead'){pat[f.key]=pat[f.key]||{f,c:0};pat[f.key].c++}}));
const pl=Object.values(pat).sort((a,b)=>(b.c*b.f.w)-(a.c*a.f.w)).slice(0,6);
const nm=ahead.length;
let h='<div class="card" id="why"><details id="whyd"><summary class="why">Why are my competitors ahead of me? <span class="pill">click to explore</span></summary>';
h+=`<div class="note">${self?`The client ranks #${self.rank_group} for "${esc(kw)}". `:`The client is not in the top ${d.items.length} results for "${esc(kw)}". `}${nm} competitor${nm>1?'s are':' is'} ahead. Below: the pattern across them, then a head-to-head for each. Everything here is measured from Google Maps data.</div>`;
h+='<h2 style="margin-top:14px">The pattern</h2>';
h+=pl.length?'<ul>'+pl.map(o=>`<li><b>${o.c} of ${nm}</b> have ${esc(o.f.pat)}</li>`).join('')+'</ul>':'<div>No clear measurable gap. The competitors may be ahead because of signals this version cannot see (listed at the bottom).</div>';
h+='<h2 style="margin-top:14px">Head-to-head</h2>';
rows.forEach((r,i)=>{const c=r.c,tp=r.top.slice(0,3);
h+=`<details class="cmp" id="c${r.ix}"><summary>#${c.rank_group} ${esc(c.title.slice(0,60))} <span class="chips">${tp.length?'ahead mainly on: '+tp.map(o=>esc(o.f.label.toLowerCase())).join(', '):'no clear measurable gap'}</span></summary>
<div class="t"><table><tr><th>Factor</th><th>Them</th><th>You</th><th>Result</th></tr>${r.F.map(f=>`<tr><td>${esc(f.label)}</td><td>${esc(f.them)}</td><td>${esc(f.you)}</td><td class="v-${f.verdict}">${{ahead:'They are ahead',behind:'You are ahead',even:'Similar',na:'Not available'}[f.verdict]}</td></tr>`).join('')}</table></div>`;
const al=r.top;h+=al.length?'<div style="margin-top:8px"><b>How to close the gap, most important first</b></div><ul>'+al.map(o=>`<li><b>${esc(o.f.label)}:</b> ${esc(o.f.why)}<div class="fix">Do: ${esc(o.f.fix)}</div></li>`).join('')+'</ul>':'<div style="margin-top:8px">Nothing measurable explains this one. Check the signals listed at the bottom.</div>';
h+='</details>'});
h+='<div class="note"><b>Not measured in this version, and also used by Google:</b> how recently and how often reviews arrive, what the reviews say, posts and Q&amp;A, the website\'s content and links from other sites, listings on other directories, and the services or products listed. Check these manually for the top competitors, or wait for the next phase.</div>';
h+='</details></div>';return h}
function openWhy(ix){const d=$('whyd');if(!d)return;d.open=true;const c=ix>=0?$('c'+ix):null;if(c)c.open=true;(c||$('why')).scrollIntoView({behavior:'smooth',block:'start'})}
function wider(c){const p=c.split(',');const z=parseInt((p[2]||'').replace(/z/i,''))||13;return p[0]+','+p[1]+','+Math.max(9,z-3)+'z'}

function render(client,d,kw,loc){
const comp=d.items.filter(i=>i.place_id!==client.place_id).slice(0,10),n=comp.length,self=d.items.find(i=>i.place_id===client.place_id);
if(!n){$('rep').innerHTML='<div class="card"><b>No competitors were returned for "'+esc(kw)+'".</b><div class="note">Try a broader keyword (for example the plain service, such as "car rental"), a wider area (add a lower zoom to the coordinates, such as ,11z), or use just the city without coordinates.</div></div>';return}
const B={rev:med(comp.map(votes)),rat:med(comp.map(stars)),ph:med(comp.map(i=>i.total_photos||0)),sec:med(comp.map(i=>(i.additional_categories||[]).length)),web:comp.filter(i=>i.domain).length};
const cv=votes(client),cs=stars(client),cp=client.total_photos||0,mine=new Set(cats(client).map(cn));
const pc={};comp.forEach(i=>{const k=cn(i.category);if(k){pc[k]=pc[k]||{n:i.category,c:0};pc[k].c++}});
const top=Object.values(pc).sort((a,b)=>b.c-a.c)[0];
const fq={};comp.forEach(i=>{const cl=cats(i);new Set(cl.map(cn)).forEach(k=>{fq[k]=fq[k]||{n:cl.find(x=>cn(x)===k),c:0};fq[k].c++})});
const thr=Math.max(2,Math.ceil(n*0.4));
const list=Object.entries(fq).map(([k,v])=>({k,n:v.n,c:v.c,has:mine.has(k)})).sort((a,b)=>b.c-a.c).slice(0,12);
const miss=list.filter(x=>!x.has&&x.c>=thr);
const F=[];const add=(pri,tag,title,body)=>F.push({pri,tag,title,body});
if(client.is_claimed===false)add('High','Data','Listing is not claimed','Claim and verify the profile first. Nothing else matters until the business controls it.');
if(top&&cn(client.category)!==cn(top.n)&&top.c>=thr)add('High','Data','Primary category differs from the market',`${top.c} of ${n} competitors use "${top.n}" as their primary category. The client uses "${client.category||'none'}". Switch only if "${top.n}" truly describes the business, and keep the current one as a secondary.`);
if(miss.length)add('High','Data','Missing secondary categories',`Used by many competitors but not by the client: ${miss.slice(0,6).map(x=>`${x.n} (${x.c}/${n})`).join(', ')}. Add the ones that genuinely apply.`);
if(cv<B.rev*0.8){const gap=Math.ceil(B.rev-cv),pm=Math.max(1,Math.ceil(gap/6));add(cv<B.rev*0.5?'High':'Medium','Data','Review volume is below competitors',`Competitor median is ${B.rev} reviews and the client has ${cv}. Closing a gap of ${gap} in about 6 months means roughly ${pm} new reviews a month. Ask every happy customer, and have the request mention the service and area.`)}
else add('Low','Data','Review volume is at or above the competitor median',`Client ${cv} vs median ${B.rev}. Keep new reviews coming steadily. Review dates (velocity) are not measured in this version.`);
if(cs&&cs<B.rat-0.2)add('Medium','Data','Rating is below competitors',`Client ${cs} vs median ${B.rat}. Reply to every review, fix recurring complaints, and ask satisfied customers to review.`);
let tgt=Math.max(Math.ceil(B.ph*1.1),cp);
if(cp<B.ph*0.8){const pw=Math.max(2,Math.ceil((tgt-cp)/8));add('Medium','Data','Fewer photos than competitors',`Competitor median is ${B.ph} photos and the client has ${cp}. Aim for about ${tgt}: roughly ${pw} new photos a week for 8 weeks, not all at once. See the shot list below.`)}
if(!client.domain&&B.web>=Math.ceil(n*0.5))add('Medium','Data','No website listed',`${B.web} of ${n} competitors list a website and the client does not. Add one, ideally with a page for the main service.`);
add('Low','Best practice','Posts: start simple','Competitor posting is not measured in this version (planned for Phase 2). Posts mainly help engagement and conversions, not rankings. A reasonable start is 1 to 2 posts a week using the calendar below.');
const ord={High:0,Medium:1,Low:2};F.sort((a,b)=>ord[a.pri]-ord[b.pri]);

const ahead=comp.filter(c=>!self||c.rank_group<self.rank_group),aheadIds=new Set(ahead.map(c=>c.place_id));
const yes='\u2713',no='\u2013',city=esc(loc.location||'this area'),cat=esc(client.category||'your service');
let h='';
h+=`<div class="card"><h2>${esc(client.title)}</h2><div class="s">${esc(client.address||'')}</div><div class="kv">
<div><b>${esc(client.category||'None')}</b><span>Primary category</span></div><div><b>${(client.additional_categories||[]).length}</b><span>Secondary categories</span></div>
<div><b>${cv}</b><span>Reviews</span></div><div><b>${cs||'-'}</b><span>Rating</span></div><div><b>${cp}</b><span>Photos</span></div>
<div><b>${client.domain?yes:no}</b><span>Website</span></div><div><b>${self?'#'+self.rank_group:'Not in top '+d.items.length}</b><span>Rank for "${esc(kw)}"</span></div></div>
<div style="margin-top:10px"><a href="#why" onclick="openWhy(-1);return false"><b>Why are my competitors ahead of me? \u2192</b></a></div><div class="note">If this is not your client, search again with the exact Google Maps name.</div></div>`;
h+=whyCard(client,ahead,self,d,kw,loc,top,fq,thr,mine,comp);

h+=`<div class="card"><h2>What to do, in priority order</h2>${F.map(f=>`<div class="r ${f.pri}"><span class="tag">${f.pri} priority<span class="pill">${f.tag}</span></span><div><b>${esc(f.title)}</b></div><div>${esc(f.body)}</div></div>`).join('')}
<div class="note">"Data" means the finding comes from the competitors measured here. "Best practice" means general guidance, not measured in this market.${n<5?' Only '+n+' competitors were found, so treat benchmarks with caution.':''}</div></div>`;

h+=`<div class="card"><h2>Competitors for "${esc(kw)}" in ${city}</h2><div class="t"><table><tr><th>Rank</th><th>Business</th><th>Primary category</th><th>Extra cats</th><th>Reviews</th><th>Rating</th><th>Photos</th><th>Site</th><th>Why ahead?</th></tr>
${comp.map((i,ix)=>`<tr><td>#${i.rank_group}</td><td>${esc(i.title)}</td><td>${esc(i.category||'')}</td><td>${(i.additional_categories||[]).length}</td><td>${votes(i)}</td><td>${stars(i)||''}</td><td>${i.total_photos||0}</td><td>${i.domain?yes:no}</td><td>${aheadIds.has(i.place_id)?'<a href="#why" onclick="openWhy('+ix+');return false">Why?</a>':''}</td></tr>`).join('')}
<tr><th></th><th>Median</th><th></th><th>${B.sec}</th><th>${B.rev}</th><th>${B.rat}</th><th>${B.ph}</th><th>${B.web}/${n}</th><th></th></tr></table></div></div>`;

h+=`<div class="card"><h2>Categories used by competitors</h2><div class="t"><table><tr><th>Category</th><th>Used by</th><th>Client has it</th></tr>
${list.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.c} of ${n}</td><td>${x.has?yes:no}</td></tr>`).join('')}</table></div></div>`;

h+=`<div class="card"><h2>Photo plan <span class="pill">Best practice</span></h2>
<div>Target: about ${tgt} photos (competitor median ${B.ph}, client ${cp}). Add them gradually, around ${Math.max(2,Math.ceil(Math.max(tgt-cp,0)/8))} a week.</div>
<ul><li>Exterior with the signage and entrance, so customers recognise the place</li><li>Interior and reception or waiting area</li><li>The team, with real faces and names where possible</li><li>The service being delivered (with customer consent)</li><li>Equipment, products or facilities</li><li>Before and after, where relevant to the business</li><li>A clear logo and a good cover photo</li></ul>
<div class="note">Use real, well-lit photos, not stock images, and avoid heavy text overlays. Competitor photo content is not analysed in this version, only the counts.</div></div>`;

h+=`<div class="card"><h2>4-week post calendar <span class="pill">Best practice</span></h2><ul>
<li><b>Week 1:</b> Service spotlight: what ${cat} involves, who it is for, how to book in ${city}</li>
<li><b>Week 2:</b> Customer story or review highlight (with permission)</li>
<li><b>Week 3:</b> Behind the scenes or meet the team</li>
<li><b>Week 4:</b> A helpful tip or a frequently asked question, plus any current offer</li></ul>
<div class="note">Post once or twice a week on the same days, with a clear call to action such as call, book or visit. Competitor posting cadence will be measured in Phase 2.</div></div>`;

h+=`<div class="noprint"><button onclick="window.print()">Print or save as PDF</button><button class="sec" onclick="copySum()">Copy summary</button></div>`;
$('rep').innerHTML=h;window.lastSummary=client.title+' ('+(loc.location||'')+')\n'+F.map(f=>`[${f.pri}] ${f.title}: ${f.body}`).join('\n');
}
function copySum(){try{navigator.clipboard.writeText(window.lastSummary||'');$('msg').textContent='Summary copied.'}catch(e){$('msg').textContent='Could not copy. Select the text manually.'}}
</script></body></html>
